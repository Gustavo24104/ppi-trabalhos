
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Game of the Years</title>
</head>

<body>

    <h1>Game of the Years</h1>

    <p>Cada ano esconde uma história!</p>

    <h2>Cadastro de Jogador</h2>

    <p>Preencha os dados abaixo para criar sua conta.</p>

    <form action="#" method="post">

        <label for="nome">Nome do jogador:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <br><br>

        <label for="categoria">Categoria favorita:</label>

        <select id="categoria" name="categoria">
            <option value="historia">História</option>
            <option value="cinema">Cinema</option>
            <option value="literatura">Literatura</option>
            <option value="musica">Música</option>
            <option value="ciencia">Ciência</option>
            <option value="esportes">Esportes</option>
        </select>

        <br><br>

        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Aceito os termos de uso do jogo.</label>

        <br><br>

        <input type="submit" value="Enviar">

        <input type="reset" value="Limpar">

    </form>

</body>
</html>
